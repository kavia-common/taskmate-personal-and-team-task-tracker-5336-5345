name: taskmate_flutter_app
description: "TaskMate - Personal & Team Task Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  # State management
  provider: ^6.1.5
  # Local storage
  shared_preferences: ^2.3.2
  # Utils
  intl: ^0.19.0
  path: ^1.9.0
  # Env
  flutter_dotenv: ^5.2.1
  # UI
  flutter_staggered_grid_view: ^0.7.0
  cupertino_icons: ^1.0.8

  # Firebase packages to be added by users after configuring Firebase.
  # Keeping them commented ensures app builds without Firebase.
  # firebase_core: ^3.8.1
  # cloud_firestore: ^5.6.2
  # firebase_auth: ^5.3.1
  # firebase_messaging: ^15.1.3
  # google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
