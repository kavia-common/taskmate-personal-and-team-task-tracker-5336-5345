name: taskmate_flutter_app
description: "TaskMate Flutter app - Firebase powered task & project tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Core app libs
  provider: ^6.1.5
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  meta: ^1.16.0
  collection: ^1.18.0

  # Firebase + Google Sign-In
  firebase_core: ^3.8.1
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.4

  # Optional/local notifications (stubbed for later integration)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.3

  # Existing utilities that may still be used in parts of the app
  shared_preferences: ^2.2.3
  path: ^1.9.1
  sqflite: ^2.4.2
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
